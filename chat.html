<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MChats - Chat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #020b18;
    color: white;
}

.app {
    max-width: 500px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: #031426;
    box-shadow: 0 0 30px #00aaff;
}

.header {
    background: #041d35;
    color: white;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #008cff;
    box-shadow: 0 0 15px #0077ff;
}

.back {
    font-size: 28px;
    cursor: pointer;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #062d4d;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #00aaff;
    box-shadow: 0 0 12px #00aaff;
}

.user-info h3 {
    font-size: 17px;
}

.user-info p {
    font-size: 12px;
    margin-top: 3px;
    color: #00d9ff;
}

.messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.message {
    max-width: 75%;
    padding: 10px 13px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: #08243c;
    border: 1px solid #075b91;
    color: white;
    word-wrap: break-word;
}

.sent {
    margin-left: auto;
    background: #0066cc;
    border: 1px solid #00c8ff;
    box-shadow: 0 0 8px rgba(0,180,255,0.5);
}

.sender {
    font-size: 10px;
    color: #00d9ff;
    margin-bottom: 4px;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #04182b;
    border-top: 1px solid #008cff;
}

.input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #0077bb;
    border-radius: 25px;
    outline: none;
    background: #061f35;
    color: white;
    font-size: 15px;
}

.input-area input::placeholder {
    color: #8ba8bd;
}

.input-area button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #008cff;
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 0 15px #008cff;
}

.input-area button:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="back" onclick="goBack()">‹</div>

        <div class="avatar">👤</div>

        <div class="user-info">
            <h3>MChats</h3>
            <p id="statusText">Connecting...</p>
        </div>

    </div>

    <div class="messages" id="messages">
        <div class="message">
            Loading messages...
        </div>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
        >

        <button id="sendBtn">➤</button>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyDPWKvTDJFNismRcNkfgJ-s2UwzNAQI4KY",

    authDomain: "mchats-39fc5.firebaseapp.com",

    projectId: "mchats-39fc5",

    storageBucket: "mchats-39fc5.firebasestorage.app",

    messagingSenderId: "946457566474",

    appId: "1:946457566474:web:e317336ac862d6a622aef3",

    measurementId: "G-H92Q4PD5CB"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const messagesBox =
document.getElementById("messages");

const input =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const statusText =
document.getElementById("statusText");


let currentUser = null;


// AUTH CHECK

onAuthStateChanged(auth, (user) => {

    if (!user) {

        statusText.innerText = "Not logged in";

        window.location.href = "index.html";

        return;
    }

    currentUser = user;

    statusText.innerText =
        user.email;

    loadMessages();

});


// SEND MESSAGE

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    if (!currentUser) {

        alert("Please login first.");

        return;
    }

    try {

        await addDoc(
            collection(db, "chats"),
            {

                senderId: currentUser.uid,

                senderEmail: currentUser.email,

                text: text,

                createdAt: serverTimestamp()

            }
        );

        input.value = "";

    }

    catch(error) {

        console.error(error);

        alert(error.message);

    }

}


// SEND BUTTON

sendBtn.addEventListener(
    "click",
    sendMessage
);


// ENTER TO SEND

input.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


// LOAD REAL-TIME MESSAGES

function loadMessages() {

    const q = query(
        collection(db, "chats"),
        orderBy("createdAt", "asc")
    );

    onSnapshot(q, (snapshot) => {

        messagesBox.innerHTML = "";

        snapshot.forEach((doc) => {

            const data = doc.data();

            const message =
                document.createElement("div");

            const isMine =
                data.senderId === currentUser.uid;

            message.className =
                isMine
                ? "message sent"
                : "message";

            message.innerHTML = `
                <div class="sender">
                    ${escapeHTML(data.senderEmail || "User")}
                </div>

                <div>
                    ${escapeHTML(data.text || "")}
                </div>
            `;

            messagesBox.appendChild(message);

        });

        messagesBox.scrollTop =
            messagesBox.scrollHeight;

    }, (error) => {

        console.error(error);

        messagesBox.innerHTML =
            "<div class='message'>Unable to load messages.</div>";

    });

}


// SECURITY

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// BACK

window.goBack = function() {

    window.location.href =
        "index.html";

};

</script>

</body>
</html>
