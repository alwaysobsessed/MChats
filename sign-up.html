<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MChats - Sign Up</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    }

    .logo {
        text-align: center;
        margin-bottom: 25px;
    }

    .logo h1 {
        color: #667eea;
        font-size: 34px;
    }

    .logo p {
        color: #777;
        margin-top: 6px;
    }

    .form {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
        font-size: 15px;
    }

    input:focus {
        border-color: #667eea;
    }

    button {
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .switch {
        text-align: center;
        margin-top: 18px;
        color: #777;
        font-size: 14px;
    }

    .switch span {
        color: #667eea;
        font-weight: bold;
        cursor: pointer;
    }

    .message {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>

</head><body><div class="container"><div class="logo">
    <h1>MChats</h1>
    <p>Create your account</p>
</div>

<form class="form" id="signupForm">

    <input
        type="text"
        id="name"
        placeholder="Full name"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        required
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
        minlength="6"
        required
    >

    <button type="submit" id="signupBtn">
        Create Account
    </button>

</form>

<div class="switch">
    Already have an account?
    <span id="loginBtn">Login</span>
</div>

<div id="message" class="message"></div>

</div><script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // FIREBASE CONFIG

    const firebaseConfig = {

        apiKey: "AIzaSyDPWKvTDJFNismRcNkfgJ-s2UwzNAQI4KY",

        authDomain: "mchats-39fc5.firebaseapp.com",

        projectId: "mchats-39fc5",

        storageBucket: "mchats-39fc5.firebasestorage.app",

        messagingSenderId: "946457566474",

        appId: "1:946457566474:web:e317336ac862d6a622aef3"

    };


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // ELEMENTS

    const form = document.getElementById("signupForm");

    const nameInput = document.getElementById("name");

    const emailInput = document.getElementById("email");

    const passwordInput = document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const signupBtn =
        document.getElementById("signupBtn");

    const message =
        document.getElementById("message");


    // SIGN UP

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const name = nameInput.value.trim();

        const email = emailInput.value.trim();

        const password = passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        // CHECK PASSWORD

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        signupBtn.disabled = true;

        signupBtn.textContent =
            "Creating Account...";

        message.textContent = "";


        try {

            // CREATE FIREBASE ACCOUNT

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            // SAVE NAME IN FIREBASE AUTH PROFILE

            await updateProfile(user, {
                displayName: name
            });


            message.textContent =
                "Account created successfully! 🎉";


            signupBtn.textContent =
                "Account Created";


            // GO TO INDEX

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            if (error.code === "auth/email-already-in-use") {

                message.textContent =
                    "This email is already registered.";

            } else if (error.code === "auth/invalid-email") {

                message.textContent =
                    "Please enter a valid email.";

            } else if (error.code === "auth/weak-password") {

                message.textContent =
                    "Password is too weak.";

            } else {

                message.textContent =
                    error.message;

            }

            signupBtn.disabled = false;

            signupBtn.textContent =
                "Create Account";

        }

    });


    // LOGIN BUTTON

    document.getElementById("loginBtn")
        .addEventListener("click", () => {

            window.location.href =
                "login.html";

        });

</script></body>
</html>
