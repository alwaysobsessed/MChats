<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MChats</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
        }

        .app {
            max-width: 500px;
            height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .tabs {
            background: #075e54;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .tabs div {
            font-weight: bold;
        }

        .search {
            padding: 12px;
            background: #f0f2f5;
        }

        .search input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }

        .user {
            display: flex;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 14px;
        }

        .user-info h3 {
            font-size: 17px;
        }

        .user-info p {
            color: #777;
            margin-top: 5px;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>MChats</h1>
        <div>⋮</div>
    </div>

    <div class="tabs">
        <div>CHATS</div>
        <div>STATUS</div>
        <div>CALLS</div>
    </div>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search users..."
            oninput="searchUsers()"
        >
    </div>

    <div id="userList">

        <div class="user" onclick="openChat('Rahim')">
            <div class="avatar">👤</div>

            <div class="user-info">
                <h3>Rahim</h3>
                <p>Online</p>
            </div>
        </div>

        <div class="user" onclick="openChat('Karim')">
            <div class="avatar">👤</div>

            <div class="user-info">
                <h3>Karim</h3>
                <p>Last seen recently</p>
            </div>
        </div>

        <div class="user" onclick="openChat('Nabil')">
            <div class="avatar">👤</div>

            <div class="user-info">
                <h3>Nabil</h3>
                <p>Online</p>
            </div>
        </div>

    </div>

    <div id="noResult" class="empty hidden">
        No user found.
    </div>

</div>

<script>

function searchUsers() {

    const input = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const users = document.querySelectorAll(".user");

    let found = false;

    users.forEach(function(user) {

        const name = user
            .querySelector("h3")
            .textContent
            .toLowerCase();

        if (name.includes(input)) {
            user.classList.remove("hidden");
            found = true;
        } else {
            user.classList.add("hidden");
        }

    });

    document
        .getElementById("noResult")
        .classList.toggle("hidden", found);

}

function openChat(username) {

    window.location.href =
        "chat.html?user=" +
        encodeURIComponent(username);

}

</script>

</body>
</html>
