<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MChats</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: auto;
      border-radius: 25px;
      background: white;
      color: #667eea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-top: 20px;
      font-size: 38px;
    }

    p {
      margin-top: 10px;
      opacity: 0.9;
      line-height: 1.5;
    }

    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #667eea;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style></head><body>  <div class="container"><div class="logo">M</div>

<h1>MChats</h1>

<p>
  Simple, fast and friendly chatting.
  Connect with your friends on MChats.
</p>

<button onclick="startChat()">Get Started</button>

<div class="status" id="status">
  MChats is ready 🚀
</div>

  </div>  <script>
    function startChat() {
      document.getElementById("status").innerText =
        "Chat system coming soon 🚀";
    }
  </script></body>
</html>
