<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MChats</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
        }

        .app {
            max-width: 500px;
            height: 100vh;
            margin: auto;
            background: white;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 24px;
        }

        .icons {
            font-size: 22px;
        }

        .tabs {
            background: #075e54;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .tabs div {
            font-weight: bold;
        }

        .chat {
            display: flex;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #eeeeee;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #dddddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 14px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-info h3 {
            font-size: 17px;
        }

        .chat-info p {
            color: #777777;
            margin-top: 5px;
        }

        .time {
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="header">
            <h1>MChats</h1>
            <div class="icons">🔍 ⋮</div>
        </div>

        <div class="tabs">
            <div>CHATS</div>
            <div>STATUS</div>
            <div>CALLS</div>
        </div>

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <h3>Alex</h3>
                <p>Hello! 👋</p>
            </div>

            <div class="time">10:30</div>
        </div>

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <h3>John</h3>
                <p>See you tomorrow.</p>
            </div>

            <div class="time">09:15</div>
        </div>

    </div>

</body>
</html>
