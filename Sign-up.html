<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MChats - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #075e54;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 6px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #075e54;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #075e54;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 14px;
        }

        .switch span {
            color: #075e54;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>MChats</h1>
        <p>Create your account</p>
    </div>

    <form class="form" onsubmit="signup(event)">

        <input
            type="text"
            id="name"
            placeholder="Full name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="switch">
        Already have an account?
        <span onclick="login()">Login</span>
    </div>

    <div id="message" class="message"></div>

</div>

<script>

function signup(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;
    }

    message.textContent =
        "Account system will be connected soon.";

}

function login() {

    window.location.href = "login.html";

}

</script>

</body>
</html>
