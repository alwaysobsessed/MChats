DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MChats</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: auto;
      border-radius: 25px;
      background: white;
      color: #667eea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
    }

    h1 {
      margin-top: 20px;
      font-size: 38px;
    }

    p {
      margin-top: 10px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #667eea;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: transparent;
      color: white;
      border: 1px solid white;
      margin-left: 5px;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
    }

    #authBox,
    #userBox {
      margin-top: 25px;
    }
  </style></head><body>  <div class="container"><div class="logo">M</div>

<h1>MChats</h1>

<p id="welcome">
  Simple, fast and friendly chatting.
</p>

<div id="authBox">

  <input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="signUp()">Sign Up</button>
  <button class="secondary" onclick="login()">Login</button>

</div>

<div id="userBox" style="display:none;">

  <p id="userEmail"></p>

  <button onclick="logout()">Logout</button>

</div>

<div class="status" id="status">
  MChats is ready 🚀
</div>

  </div>  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPWKvTDJFNismRcNkfgJ-s2UwzNAQI4KY",
      authDomain: "mchats-39fc5.firebaseapp.com",
      projectId: "mchats-39fc5",
      storageBucket: "mchats-39fc5.firebasestorage.app",
      messagingSenderId: "946457566474",
      appId: "1:946457566474:web:e317336ac862d6a622aef3",
      measurementId: "G-H92Q4PD5CB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const status = document.getElementById("status");

    window.signUp = async function () {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        status.innerText = "Please enter email and password.";
        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        status.innerText = "Account created successfully! 🎉";

      } catch (error) {

        status.innerText = error.message;

      }
    };

    window.login = async function () {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        status.innerText = "Please enter email and password.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        status.innerText = "Login successful! 🚀";

      } catch (error) {

        status.innerText = error.message;

      }
    };

    window.logout = async function () {

      try {

        await signOut(auth);

        status.innerText = "Logged out successfully.";

      } catch (error) {

        status.innerText = error.message;

      }
    };

    onAuthStateChanged(auth, (user) => {

      const authBox = document.getElementById("authBox");
      const userBox = document.getElementById("userBox");
      const userEmail = document.getElementById("userEmail");

      if (user) {

        authBox.style.display = "none";
        userBox.style.display = "block";

        userEmail.innerText =
          "Logged in as: " + user.email;

        document.getElementById("welcome").innerText =
          "Welcome to MChats! 💬";

      } else {

        authBox.style.display = "block";
        userBox.style.display = "none";

        document.getElementById("welcome").innerText =
          "Simple, fast and friendly chatting.";

      }

    });

  </script></body>
</html>
