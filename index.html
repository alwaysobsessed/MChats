<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MChats</title>


<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }


    body {

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

        color: white;

        padding: 20px;

    }


    .container {

        width: 100%;

        max-width: 600px;

        margin: auto;

        text-align: center;

        padding: 25px;

        border-radius: 25px;

        background:
            rgba(255,255,255,0.15);

        backdrop-filter: blur(15px);

        box-shadow:
            0 15px 40px
            rgba(0,0,0,0.25);

    }


    .logo {

        width: 70px;

        height: 70px;

        margin: auto;

        border-radius: 20px;

        background: white;

        color: #667eea;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 30px;

        font-weight: bold;

    }


    h1 {

        margin-top: 15px;

        font-size: 34px;

    }


    #welcome {

        margin-top: 5px;

    }


    input {

        width: 100%;

        padding: 14px;

        margin-top: 12px;

        border: none;

        border-radius: 12px;

        outline: none;

        font-size: 15px;

    }


    button {

        margin-top: 15px;

        padding: 13px 22px;

        border: none;

        border-radius: 25px;

        background: white;

        color: #667eea;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

    }


    button:disabled {

        opacity: 0.6;

        cursor: not-allowed;

    }


    .secondary {

        background: transparent;

        color: white;

        border: 1px solid white;

        margin-left: 5px;

    }


    #userBox {

        margin-top: 20px;

    }


    #userEmail {

        margin-bottom: 5px;

        word-break: break-word;

    }


    #chatBox {

        display: none;

        margin-top: 20px;

    }


    #messages {

        height: 350px;

        overflow-y: auto;

        background:
            rgba(0,0,0,0.15);

        border-radius: 15px;

        padding: 12px;

        text-align: left;

    }


    .message {

        background: white;

        color: #333;

        padding: 10px 13px;

        border-radius: 15px;

        margin-bottom: 10px;

        word-wrap: break-word;

    }


    .sender {

        font-size: 11px;

        color: #667eea;

        font-weight: bold;

        margin-bottom: 4px;

    }


    .sendArea {

        display: flex;

        gap: 8px;

    }


    .sendArea input {

        flex: 1;

    }


    .sendArea button {

        width: 90px;

    }


    #status {

        margin-top: 15px;

        font-size: 14px;

        word-break: break-word;

    }

</style>

</head><body><div class="container"><div class="logo">
    M
</div>


<h1>
    MChats
</h1>


<p id="welcome">
    Simple, fast and friendly chatting.
</p>


<!-- LOGIN -->

<div id="authBox">


    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button id="loginBtn">
        Login
    </button>


    <button
        class="secondary"
        id="signupBtn"
    >
        Sign Up
    </button>


</div>


<!-- LOGGED IN USER -->

<div
    id="userBox"
    style="display:none;"
>

    <p id="userName"></p>

    <p id="userEmail"></p>


    <button id="logoutBtn">
        Logout
    </button>

</div>


<!-- CHAT -->

<div id="chatBox">


    <div id="messages">

        <p>
            Loading messages...
        </p>

    </div>


    <div class="sendArea">


        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            maxlength="1000"
        >


        <button id="sendBtn">
            Send
        </button>


    </div>


</div>


<div id="status">
    MChats is ready 🚀
</div>

</div><script type="module">


    // FIREBASE APP

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    // FIREBASE AUTH

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // FIRESTORE

    import {
        getFirestore,
        collection,
        addDoc,
        query,
        orderBy,
        onSnapshot,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    // FIREBASE CONFIG

    const firebaseConfig = {

        apiKey:
        "AIzaSyDPWKvTDJFNismRcNkfgJ-s2UwzNAQI4KY",

        authDomain:
        "mchats-39fc5.firebaseapp.com",

        projectId:
        "mchats-39fc5",

        storageBucket:
        "mchats-39fc5.firebasestorage.app",

        messagingSenderId:
        "946457566474",

        appId:
        "1:946457566474:web:e317336ac862d6a622aef3"

    };



    // INITIALIZE

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    // ELEMENTS

    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const authBox =
        document.getElementById("authBox");


    const userBox =
        document.getElementById("userBox");


    const chatBox =
        document.getElementById("chatBox");


    const userName =
        document.getElementById("userName");


    const userEmail =
        document.getElementById("userEmail");


    const messageInput =
        document.getElementById("messageInput");


    const messages =
        document.getElementById("messages");


    const status =
        document.getElementById("status");


    const loginBtn =
        document.getElementById("loginBtn");


    const signupBtn =
        document.getElementById("signupBtn");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const sendBtn =
        document.getElementById("sendBtn");



    // LOGIN

    loginBtn.addEventListener(
        "click",
        async () => {


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            if (!email || !password) {

                status.innerText =
                    "Please enter email and password.";

                return;

            }


            loginBtn.disabled = true;

            loginBtn.innerText =
                "Logging in...";


            try {


                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                status.innerText =
                    "Login successful! 🚀";


            }


            catch (error) {


                console.error(error);


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    status.innerText =
                        "Incorrect email or password.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    status.innerText =
                        "Please enter a valid email.";

                }

                else {

                    status.innerText =
                        error.message;

                }

            }


            finally {

                loginBtn.disabled = false;

                loginBtn.innerText =
                    "Login";

            }

        }
    );



    // GO TO SIGN UP

    signupBtn.addEventListener(
        "click",
        () => {

            window.location.href =
                "signup.html";

        }
    );



    // LOGOUT

    logoutBtn.addEventListener(
        "click",
        async () => {


            try {

                await signOut(auth);

                status.innerText =
                    "Logged out successfully.";

            }

            catch (error) {

                status.innerText =
                    error.message;

            }

        }
    );



    // AUTH STATE

    onAuthStateChanged(
        auth,
        (user) => {


            if (user) {


                // HIDE LOGIN

                authBox.style.display =
                    "none";


                // SHOW USER

                userBox.style.display =
                    "block";


                // SHOW CHAT

                chatBox.style.display =
                    "block";


                userName.innerText =
                    "Welcome, " +
                    (user.displayName || "User") +
                    " 👋";


                userEmail.innerText =
                    "Logged in as: " +
                    user.email;


                status.innerText =
                    "Welcome to MChats! 🚀";


                loadMessages();


            }

            else {


                // SHOW LOGIN

                authBox.style.display =
                    "block";


                // HIDE USER

                userBox.style.display =
                    "none";


                // HIDE CHAT

                chatBox.style.display =
                    "none";


                userName.innerText =
                    "";


                userEmail.innerText =
                    "";


            }

        }
    );



    // SEND MESSAGE

    sendBtn.addEventListener(
        "click",
        sendMessage
    );



    messageInput.addEventListener(
        "keydown",
        (event) => {


            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );



    async function sendMessage() {


        const text =
            messageInput.value.trim();


        const user =
            auth.currentUser;


        if (!user) {

            status.innerText =
                "Please login first.";

            return;

        }


        if (!text) {

            return;

        }


        sendBtn.disabled = true;


        try {


            await addDoc(
                collection(
                    db,
                    "chats"
                ),
                {

                    senderId:
                        user.uid,

                    senderEmail:
                        user.email,

                    senderName:
                        user.displayName ||
                        "User",

                    text:
                        text,

                    createdAt:
                        serverTimestamp()

                }
            );


            messageInput.value = "";


            status.innerText =
                "Message sent ✅";


        }

        catch (error) {


            console.error(error);


            status.innerText =
                error.message;

        }


        finally {

            sendBtn.disabled = false;

        }

    }



    // LOAD MESSAGES

    let unsubscribeMessages = null;


    function loadMessages() {


        if (unsubscribeMessages) {

            unsubscribeMessages();

        }


        const q =
            query(
                collection(
                    db,
                    "chats"
                ),
                orderBy(
                    "createdAt",
                    "asc"
                )
            );


        unsubscribeMessages =
            onSnapshot(
                q,

                (snapshot) => {


                    messages.innerHTML = "";


                    if (snapshot.empty) {

                        messages.innerHTML =
                            "<p>No messages yet. Be the first! 👋</p>";

                        return;

                    }


                    snapshot.forEach(
                        (doc) => {


                            const data =
                                doc.data();


                            const div =
                                document.createElement(
                                    "div"
                                );


                            div.className =
                                "message";


                            const sender =
                                document.createElement(
                                    "div"
                                );


                            sender.className =
                                "sender";


                            sender.textContent =
                                data.senderName ||
                                data.senderEmail ||
                                "User";


                            const text =
                                document.createElement(
                                    "div"
                                );


                            text.textContent =
                                data.text || "";


                            div.appendChild(
                                sender
                            );


                            div.appendChild(
                                text
                            );


                            messages.appendChild(
                                div
                            );

                        }
                    );


                    messages.scrollTop =
                        messages.scrollHeight;

                },

                (error) => {


                    console.error(error);


                    messages.innerHTML =
                        "<p>Could not load messages.</p>";


                    status.innerText =
                        error.message;

                }
            );

    }

</script></body></html>
